name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ENVIRONMENT: test
  USE_MOCK_DB: "true"
  JWT_SECRET: ci-test-secret-that-is-at-least-32-bytes
  LLM_PROVIDER: mock              # no real LLM / STT / TTS calls in CI

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: mypy .
      - run: pytest -m "not guardrail"

  guardrails:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -m guardrail -v
      # Keyword rules only: a regression gate that needs no model download
      - run: python eval/run_eval.py --classifier --no-embeddings --min-accuracy 0.95

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t careflow-app .
      # The image must also start: an import that only works with the dev dependencies
      # passes every test and still breaks the container
      - run: >
          docker run --rm -e ENVIRONMENT=test -e USE_MOCK_DB=true
          -e JWT_SECRET=ci-test-secret-that-is-at-least-32-bytes careflow-app
          python -c "import main; print('app imports')"
