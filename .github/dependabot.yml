version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: monthly }
    groups: { python-deps: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: monthly }
    groups: { npm-deps: { patterns: ["*"] } }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
